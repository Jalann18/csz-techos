    <text x="27" y="40" font-family="'Barlow Condensed', Arial, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle">C</text>

    <!-- S Box (Red) -->
    <rect x="62" y="0" width="54" height="52" rx="0" fill="#E31B23" />
